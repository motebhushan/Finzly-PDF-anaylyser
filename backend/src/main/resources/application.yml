spring:
  application:
    name: pdf-analyser
  profiles:
    active: dev
  servlet:
    multipart:
      max-file-size: 25MB
      max-request-size: 25MB

server:
  port: 8080

app:
  gemini:
    api-key: ${GEMINI_API_KEY:}
    model: gemini-1.5-pro
    api-url: https://generativelanguage.googleapis.com/v1beta/models/${app.gemini.model}:generateContent
    timeout-seconds: 60
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
